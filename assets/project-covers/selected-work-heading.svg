<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="68" viewBox="0 0 1000 68" role="img" aria-labelledby="title desc">
  <title id="title">精选项目</title>
  <desc id="desc">我关注真实任务中的 AI 产品：先弄清问题，再做可验证的工作流，最后用证据决定下一步。</desc>
  <defs>
